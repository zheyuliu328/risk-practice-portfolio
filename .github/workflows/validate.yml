name: Validate portfolio and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_portfolio.py
      - name: Run the installed entry point outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          risk-practice --input "$GITHUB_WORKSPACE/examples/ecl.json" --output "$RUNNER_TEMP/ecl-result"
          risk-practice --input "$GITHUB_WORKSPACE/examples/liquidity.json" --output "$RUNNER_TEMP/liquidity-result"
          risk-practice --input "$GITHUB_WORKSPACE/examples/rates.json" --output "$RUNNER_TEMP/rates-result"
          risk-practice --input "$GITHUB_WORKSPACE/examples/concentration.json" --output "$RUNNER_TEMP/concentration-result"
