name: Validate portfolio and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_portfolio.py
      - name: Run the installed entry point outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          for request in "$GITHUB_WORKSPACE"/examples/*.json; do
            name=$(basename "$request" .json)
            risk-practice --input "$request" --output "$RUNNER_TEMP/$name-result"
          done
  flagship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the independently versioned flagship
        run: python -m pip install 'forecast-review-workbench @ git+https://github.com/zheyuliu328/forecast-review-workbench.git@41dacd968cd9941be0c0c5b4170211f6757ba52c'
      - name: Verify pending, accepted and incompatible-input states
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/verify_flagship.py" --output "$RUNNER_TEMP/flagship-evidence"
